
services:
  # ── PostgreSQL ────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: review-db
    environment:
      POSTGRES_DB: reviewdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Python NLP Microservice ───────────────────────────────────────
  nlp-service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: review-nlp
    ports:
      - "8001:8001"
    environment:
      # Point this at a labelled CSV to train on real data instead of the
      # generated bootstrap corpus. Columns: text/review + label/rating.
      DATASET_PATH: ${DATASET_PATH:-/app/data/reviews.csv}
    volumes:
      # Persist trained artefacts so a rebuild does not retrain from scratch
      # (which takes ~2 minutes and includes two t-SNE runs), and expose a
      # drop-in location for a real dataset.
      - nlp-models:/app/models
      - ./nlp-service/data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/nlp/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

  # ── Spring Boot Backend ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: review-backend
    ports:
      - "8081:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/reviewdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      NLP_SERVICE_URL: http://nlp-service:8001
      JAVA_OPTS: "-Xms256m -Xmx512m"
    depends_on:
      db:
        condition: service_healthy
      nlp-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 15s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  # ── React Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: review-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  nlp-models:
